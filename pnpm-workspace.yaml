packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
catalog:
  zod: ^4.5.4
  typescript: ^6.0.3
  varlock: 1.18.0
  next-themes: ^0.4.6
  sonner: ^2.0.8
  tailwindcss: ^4.3.3
overrides:
  # react-scripts 1 (apps/2018) only works with its own ESLint 4.
  eslint: 4.19.1
  # apps/2025 (React 18): keep its type packages off the workspace-wide @types/react 19.
  "@types/react-reconciler>@types/react": 18.3.3
  "@types/react-dom@18>@types/react": 18.3.3
